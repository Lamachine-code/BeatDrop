services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: beatdrop
      POSTGRES_PASSWORD: beatdrop
      POSTGRES_DB: beatdrop
    ports:
      - "5432:5432"
    volumes:
      - beatdrop_pg:/var/lib/postgresql/data
volumes:
  beatdrop_pg:
